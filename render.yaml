# Render Blueprint · MolCore Lab
# Despliegue de prueba (tier gratis): web (nginx) + api (FastAPI).
# La base es PostgreSQL en Neon (free tier persistente, no expira a los 30 días).
# DATABASE_URL se define como variable manual en el dashboard de molcore-api
# (no se commitea el secreto).

services:
  - type: web
    name: molcore-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DEBUG
        value: "false"

  - type: web
    name: molcore-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: API_UPSTREAM
        # URL pública de la API: en free tier el nombre interno (molcore-api) no
        # se resuelve desde la web, así que se proxya contra la URL pública.
        value: https://molcore-api.onrender.com